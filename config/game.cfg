# Tempest Tumble — edit freely, then restart the game.
window_width=1920
window_height=1080
vsync=1

key_left=A
key_right=D
key_up=W
key_down=S
key_jump=SPACE
key_attack=J
key_ability=K
key_dash=L
key_cycle_ability=Q
key_sheet=C
key_interact=E
key_pause=ESCAPE

# GLFW gamepad: 0=A jump, 1=B, 2=X attack, 3=Y ability, 4=LB, 5=RB, 7=Start
pad_jump=0
pad_interact=1
pad_attack=2
pad_ability=3
pad_cycle_ability=4
pad_sheet=5
pad_pause=7
pad_dash=4
